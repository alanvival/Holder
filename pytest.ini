[pytest]
testpaths = testes

# Os módulos do projeto ficam na raiz (e, a partir da fase 6, no pacote
# `holder/`). Sem isto, o pytest só coloca `testes/` no sys.path e nenhum
# import do projeto resolve.
pythonpath = .

markers =
    sqlserver: exige o SQL Server local (banco "holder") no ar — pule com -m "not sqlserver"
    lento: treina o modelo ou roda backtest; conta em segundos, não em milissegundos
